---
validate_config: 1
matrix:
  platform:
  - ubuntu2204
  - macos_arm64
  - windows
  bazel:
  - latest
  - last_rc
  # For the tasks that run on both the oldest supported Bazel and the newest.
  bazel_min_current:
  - 7.x
  - latest
  e2e_platform:
  - ubuntu2204
  - macos_arm64
  - windows
  - windows_arm64
  xs:
    disabled: "--@rules_perl//perl/settings:xs=false"
    enabled: "--@rules_perl//perl/settings:xs=true"

tasks:

  # --@rules_perl//perl/settings:xs=true: the XS-capable perl everywhere, so
  # perl_xs stays covered. The default (static perl on Linux, XS skipped) is
  # covered by default_ubuntu2204 and the e2e tasks.
  verify_targets:
    name: Verify targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - "--@rules_perl//perl/settings:xs=true"
    test_flags:
    - "--@rules_perl//perl/settings:xs=true"
    build_targets:
    - "//..."
    test_targets:
    - "//..."
  windows_arm64:
    build_flags:
    - "--@rules_perl//perl/settings:xs=true"
    test_flags:
    - "--@rules_perl//perl/settings:xs=true"
    build_targets:
    - "//..."
    test_targets:
    - "//..."

  # The default flags. Only on Linux do they change the perl.
  default_ubuntu2204:
    name: Default flags (static perl)
    platform: ubuntu2204
    build_targets:
    - "//..."
    test_targets:
    - "//..."

  # The oldest Bazel the rules support.
  min_bazel_ubuntu2204:
    name: Verify targets (minimum Bazel)
    platform: ubuntu2204
    bazel: 7.x
    build_flags:
    - "--@rules_perl//perl/settings:xs=true"
    test_flags:
    - "--@rules_perl//perl/settings:xs=true"
    build_targets:
    - "//..."
    test_targets:
    - "//..."

  # The same Windows build with Strawberry Perl instead of upstream Perl, so
  # the non-default distribution stays exercised.
  windows_strawberry:
    name: Windows (Strawberry Perl)
    platform: windows
    build_flags:
    - "--@rules_perl//perl/settings:distribution=strawberry"
    - "--@rules_perl//perl/settings:xs=true"
    test_flags:
    - "--@rules_perl//perl/settings:distribution=strawberry"
    - "--@rules_perl//perl/settings:xs=true"
    build_targets:
    - "//..."
    test_targets:
    - "//..."

  path_mapping_ubuntu2204:
    name: Path Mapping
    platform: ubuntu2204
    build_flags:
    - "--experimental_output_paths=strip"
    - "--@rules_perl//perl/settings:xs=true"
    build_targets:
    - "//..."
    test_flags:
    - "--experimental_output_paths=strip"
    - "--@rules_perl//perl/settings:xs=true"
    test_targets:
    - "//..."
  path_mapping_macos:
    name: Path Mapping
    platform: macos_arm64
    build_flags:
    - "--experimental_output_paths=strip"
    - "--@rules_perl//perl/settings:xs=true"
    build_targets:
    - "//..."
    test_flags:
    - "--experimental_output_paths=strip"
    - "--@rules_perl//perl/settings:xs=true"
    test_targets:
    - "//..."

  cpan_compile_ubuntu2204:
    name: CPAN Compile
    platform: ubuntu2204
    run_targets:
    # Two compilations are performed to ensure the
    # results of the first are usable by the second.
    - "//perl/cpan/3rdparty:compiler"
    - "//perl/cpan/3rdparty:compiler"

  cpan_compile_macos:
    name: CPAN Compile
    platform: macos_arm64
    run_targets:
    # Two compilations are performed to ensure the
    # results of the first are usable by the second.
    - "//perl/cpan/3rdparty:compiler"
    - "//perl/cpan/3rdparty:compiler"

  e2e_smoke:
    name: e2e smoke
    platform: ${{ e2e_platform }}
    working_directory: e2e/smoke
    build_targets:
    - "//..."

  # OpenSSL from the Bazel Central Registry, whose build generates code with
  # perl_binary and the perl toolchain; e2e/openssl/.bazelrc turns off the
  # pregenerated sources it ships so that perl does the work. Run on the oldest
  # and the newest Bazel, with the XS flag off and on: on Linux that is the
  # static perl and the glibc perl.
  e2e_openssl:
    name: "e2e OpenSSL (Bazel {bazel_min_current}, XS {xs})"
    platform: ${{ e2e_platform }}
    bazel: ${{ bazel_min_current }}
    working_directory: e2e/openssl
    build_flags:
    - "${{ xs }}"
    test_flags:
    - "${{ xs }}"
    build_targets:
    - "//..."
    - "@openssl//..."
    test_targets:
    - "//..."
    - "@openssl//..."

buildifier:
  version: latest
  warnings: "all"
